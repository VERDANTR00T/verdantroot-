<!DOCTYPE html>
<html>
<head>

<title>Verdant Root | Skin Intake</title>

<style>

body{
margin:0;
font-family:Georgia,serif;
background:#f6f6f6;
}

.header{
background:#0b3b2e;
color:white;
padding:30px;
text-align:center;
font-size:28px;
letter-spacing:2px;
}

.container{
max-width:650px;
margin:50px auto;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h2{
color:#0b3b2e;
margin-bottom:20px;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

input,select,textarea{

width:100%;
padding:12px;
margin-top:6px;
border-radius:6px;
border:1px solid #ccc;
font-size:15px;

}

button{

margin-top:25px;
width:100%;
padding:16px;
background:#0b3b2e;
color:white;
border:none;
font-size:16px;
cursor:pointer;

}

button:hover{
background:#145c46;
}

.result{

margin-top:30px;
padding:25px;
background:#f1f7f4;
border-left:5px solid #0b3b2e;

}

</style>
</head>

<body>

<div class="header">
Verdant Root AI Skin Intake
</div>

<div class="container">

<h2>Skin Analysis Intake Form</h2>

<label>Your Name</label>
<input type="text" id="name">

<label>Email</label>
<input type="email" id="email">

<label>Primary Skin Concern</label>
<select id="concern">

<option>Acne</option>
<option>Pigmentation</option>
<option>Dry Skin</option>
<option>Oily Skin</option>
<option>Dark Spots</option>
<option>Sensitivity</option>

</select>

<label>Describe Your Skin Symptoms</label>

<textarea id="description" rows="4"></textarea>

<button onclick="showResult()">Begin Skin Intake</button>

<div id="result"></div>

</div>

<script>

function showResult(){

var name=document.getElementById("name").value;
var concern=document.getElementById("concern").value;

document.getElementById("result").innerHTML=

"<div class='result'>"+
"<h3>Verdant Root Intake Confirmation</h3>"+

"<p><b>Name:</b> "+name+"</p>"+
"<p><b>Primary Concern:</b> "+concern+"</p>"+

"<p>Your information has been recorded in the Verdant Root intake system.</p>"+

"<p>Our AI-assisted dermatology guidance platform is currently under development.</p>"+

"<p>You will soon receive access to intelligent skin analysis and affordable dermatology guidance.</p>"+

"<p>For early access inquiries contact:</p>"+

"<p><b>verdantroot@gmail.com</b></p>"+

"</div>";

}

</script>

</body>
</html>
