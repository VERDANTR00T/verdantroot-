<!DOCTYPE html>
<html>
<head>
<title>Verdant Root AI Skin Analysis</title>

<style>

body{
font-family: Georgia, serif;
background:#f5f5f5;
margin:0;
}

.header{
background:#0f3d2e;
color:white;
padding:25px;
text-align:center;
font-size:28px;
letter-spacing:2px;
}

.container{
max-width:600px;
margin:40px auto;
background:white;
padding:35px;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h2{
color:#0f3d2e;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input, select, textarea{
width:100%;
padding:10px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
}

button{
margin-top:20px;
width:100%;
padding:15px;
background:#0f3d2e;
color:white;
border:none;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#145c46;
}

.result{
margin-top:25px;
padding:20px;
background:#f1f8f5;
border-left:5px solid #0f3d2e;
}

</style>
</head>

<body>

<div class="header">
Verdant Root | AI Skin Intake
</div>

<div class="container">

<h2>Skin Intake Form</h2>

<label>Your Name</label>
<input type="text" id="name">

<label>Email</label>
<input type="email" id="email">

<label>Primary Skin Concern</label>
<select id="concern">
<option>Acne</option>
<option>Pigmentation</option>
<option>Dry Skin</option>
<option>Oily Skin</option>
<option>Dark Spots</option>
<option>Sensitivity</option>
</select>

<label>Describe Symptoms</label>
<textarea id="description" rows="4"></textarea>

<button onclick="startAnalysis()">Begin AI Skin Intake</button>

<div id="resultArea"></div>

</div>

<script>

function startAnalysis(){

var name = document.getElementById("name").value;
var concern = document.getElementById("concern").value;

document.getElementById("resultArea").innerHTML =
"<div class='result'>" +

"<h3>Verdant Root Preliminary Intake Report</h3>" +

"<b>Name:</b> " + name + "<br>" +
"<b>Primary Concern:</b> " + concern + "<br><br>" +

"Our AI dermatology guidance system is currently under development." +

"<br><br>Your skin concern has been recorded in our intake system." +

"<br><br>Full AI skin analysis and dermatologist support will be available soon." +

"<br><br>For early access contact:<br>" +

"<b>verdantroot@gmail.com</b>" +

"</div>";

}

</script>

</body>
</html>
